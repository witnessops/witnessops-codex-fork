name: blocking-ci

# This is the single entrypoint for checks that block a PR merge. It also runs
# after pushes to main so the same check family stays grouped in the Actions UI.
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # WitnessOps recovery PRs run small repair checks and dependency advisories.
  # Remaining advisories, MSVC acknowledgement and full build capacity stay
  # unresolved. Keep all seven needs below: the required gate must stay red.
  # Keep reusable workflow calls alphabetized. The `required` job below is the
  # version-controlled list that the main-branch ruleset should require.
  bazel:
    if: ${{ github.repository != 'witnessops/witnessops-codex-fork' || github.event_name != 'pull_request' }}
    name: Bazel
    uses: ./.github/workflows/bazel.yml

  blob-size-policy:
    name: Blob size policy
    uses: ./.github/workflows/blob-size-policy.yml

  cargo-deny:
    name: cargo-deny
    uses: ./.github/workflows/cargo-deny.yml

  codespell:
    name: Codespell
    uses: ./.github/workflows/codespell.yml

  repo-checks:
    name: repo-checks
    uses: ./.github/workflows/repo-checks.yml

  rust-ci:
    if: ${{ github.repository != 'witnessops/witnessops-codex-fork' || github.event_name != 'pull_request' }}
    name: rust-ci
    uses: ./.github/workflows/rust-ci.yml

  sdk:
    if: ${{ github.repository != 'witnessops/witnessops-codex-fork' || github.event_name != 'pull_request' }}
    name: sdk
    uses: ./.github/workflows/sdk.yml

  witnessops-static:
    name: WitnessOps lightweight source checks (not full CI)
    if: ${{ github.repository == 'witnessops/witnessops-codex-fork' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: witnessops-static-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The PR merge commit and its two parents; no unbounded history fetch.
          fetch-depth: 2
          persist-credentials: false

      - name: Check source invariants (no compilation or test execution)
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          python3 .github/scripts/verify_cargo_workspace_manifests.py
          python3 .github/scripts/verify_tui_core_boundary.py
          python3 .github/scripts/verify_bazel_clippy_lints.py

      - name: Check proposed diff and blob sizes
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          python3 scripts/check_blob_size.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --max-bytes 512000 \
            --allowlist .github/blob-size-allowlist.txt

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  required:
    name: CI required
    timeout-minutes: 5
    permissions:
      contents: read
    # Without `always()`, GitHub skips this job after a failed dependency and a
    # required check can appear successful instead of reporting the failure.
    if: ${{ always() }}
    needs:
      - bazel
      - blob-size-policy
      - cargo-deny
      - codespell
      - repo-checks
      - rust-ci
      - sdk
    runs-on: ubuntu-24.04
    steps:
      # Keep the helper on the same combined revision as the child workflows so
      # the merge gate evaluates the exact candidate they validated.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/check_ci_results.py
